<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Arena</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='4' width='18' height='24' rx='5' fill='%234fa3ff'/%3E%3Crect x='16' y='10' width='6' height='6' rx='2' fill='white'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        /* No celular: nada de rolar, dar zoom ou selecionar enquanto se arrasta um personagem. */
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .cortina {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        padding: 24px;
        text-align: center;
        background: #0d1117;
        color: #e8eef7;
        font:
          bold 20px "Trebuchet MS",
          "Segoe UI",
          Arial,
          sans-serif;
      }
      .cortina button {
        min-width: 200px;
        min-height: 52px;
        border: 0;
        border-radius: 12px;
        background: #2f9e5b;
        color: #fff;
        font: inherit;
      }
      #falha.visivel {
        display: flex;
      }
      /* Celular em pé: o jogo é deitado, então pede para girar. */
      @media (orientation: portrait) and (max-width: 700px) {
        #girar {
          display: flex;
        }
      }
      #aviso-rede {
        display: none;
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 18px;
        border-radius: 10px;
        background: #7a2f3a;
        color: #fff;
        font:
          bold 15px "Trebuchet MS",
          "Segoe UI",
          Arial,
          sans-serif;
        z-index: 10;
      }
      #jogo {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="jogo"></div>
    <div id="girar" class="cortina">
      <div style="font-size: 54px">⟳</div>
      <div>Gire o aparelho para jogar deitado</div>
    </div>
    <div id="falha" class="cortina">
      <div id="falha-texto"></div>
      <button id="falha-botao" type="button">Tentar de novo</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
